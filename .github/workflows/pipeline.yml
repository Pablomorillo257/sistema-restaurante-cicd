name: Pipeline CI/CD - Sistema Restaurante

on: [push]

jobs:
  build-test-deploy:
    name: Build, Test, Security y Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: 2. Etapa Build - Compilacion de modulos
        run: |
          echo "Iniciando compilacion de modulos: Auth, Reservas, Pedidos y Reportes..."
          echo "Compilacion exitosa sin errores de sintaxis."

      - name: 3. Etapa Test - Pruebas unitarias y de integracion
        run: |
          echo "ERROR: Prueba fallida en modulo de Reservas (se permitio reserva fuera de horario)."
          exit 1
      - name: 4. Etapa QA y Security - Analisis estatico
        run: |
          echo "Ejecutando analisis de seguridad (OWASP / SonarQube)..."
          echo "0 vulnerabilidades criticas detectadas."

      - name: 5. Etapa Package y Deploy - Contenedor y Staging
        run: |
          echo "Construyendo imagen Docker restaurante-api:latest..."
          echo "Desplegando en entorno Staging -> Healthcheck 200 OK."
